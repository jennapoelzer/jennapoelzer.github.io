# About Section
# about_title: About Me (Use this to override about section title)
about_profile_image: images/profile_pic.png
about_content: | # this will include new lines to allow paragraphs
  Bioinformatician with a Master's degree from Dr. David Wishart's lab at the University of Alberta, where I contributed to tools such as BASys2, MiMeDB 2.0, and WEGAN to make complex omics data more accessible to researchers. 
  My core interest lies in bridging the gap between laboratory science and bioinformatics, with a particular focus on microbiome and microbiology research, alongside a broader enthusiasm for the life sciences. 
  Background in Medical Laboratory Science, including experience at the Provincial Laboratory of Public Health in Molecular Diagnostics and Acute Clinical Microbiology, as well as serving as lab manager for Dr. Ian Lewis' research group at the University of Calgary, which specializes in metabolomics and host-pathogen interactions in infectious disease.

content:
  - title: Projects
    layout: list
    content:
      - layout: left
        border: weak
        title: BASys2
        quote: >
          Next-generation bacterial genome annotation web server
        description: |
          Co-developed a next-gen bacterial genome annotation web server delivering deeper annotation up to 8,000x faster than its predecessor.
      - layout: left
        border: weak
        title: WEGAN
        quote: >
          Web-based community ecology platform
        description: |
          Major contributor to a web-based platform for community-scale microbiome ecology analysis (diversity & ordination methods, data visualization).
      - layout: left
        title: MiMeDB 2.0
        quote: >
          Microbial metabolomics database
        description: |
          Minor contributor to an update of the microbial metabolomics database.
  - title: Experience
    layout: list
    content:
      - layout: left
        title: Dr. Ian Lewis Lab, University of Calgary
        sub_title: Laboratory Manager
        caption: January 2019 - September 2020
        quote: >
          Metabolomics & host-pathogen interactions research
        description: |
          Assisted with bacterial culture and proteomic, genomic, and metabolomic sample extractions on clinical bloodborne pathogen specimens, including a novel COVID-19 extraction pipeline. Wrote and maintained SOPs and programmed the Hamilton NIMBUS liquid-handling robot. Served as Biosafety Officer.
      - layout: left
        title: Alberta Precision Laboratories (ProvLab North)
        sub_title: Medical Laboratory Technologist I - Acute Bacteriology
        caption: August 2021 - July 2022
        description: |
          Performed blood culture analysis for suspected bloodstream infections, including organism identification and antimicrobial susceptibility testing; resulted reports in Epic.
      - layout: left
        title: Alberta Precision Laboratories (ProvLab South)
        sub_title: Medical Laboratory Technologist I - Molecular Diagnostics
        caption: September 2020 - August 2021
        description: |
          Performed PCR testing (SARS-CoV-2, CSF, transplant, GI, pertussis, meningococcal, respiratory/influenza panels); resulted reports in Cerner Millennium. Served as Responsible Technologist on off-shifts during peak COVID-19 demand.
      - layout: right
        title: Alberta Health Services (ProvLab North)
        sub_title: Medical Laboratory Technologist I - Molecular Diagnostics
        caption: December 2015 - January 2019
        description: |
          Performed PCR testing (SARS-CoV-2, CSF, transplant, GI, pertussis, respiratory/influenza panels); resulted reports in Cerner Millennium.
  - title: Education
    layout: list
    content:
      - layout: left
        title: University of Alberta, Edmonton AB
        sub_title: M.Sc. Biological Sciences
        caption: 2023 - 2026
        quote: >
          Bioinformatics research, supervised by Dr. David Wishart
        description: |
          Thesis: "Bioinformatic Approaches for Genomic and Community-Scale Microbiology." Co-developed BASys2 and authored a published review of microbiome bioinformatics tools. Major contributor to WEGAN, minor contributor to MiMeDB 2.0. Received the Graduate Student Teaching Award (2024) as TA for MICRB 264 Lab.
      - layout: left
