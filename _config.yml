about_profile_image: images/profile_pic.png
about_content: | # this will include new lines to allow paragraphs
  Bioinformatician with a Master's degree from Dr. David Wishart's lab at the University of Alberta, where I contributed to tools such as BASys2, MiMeDB 2.0, and WEGAN to make complex omics data more accessible to researchers. 
  My core interest lies in bridging the gap between laboratory science and bioinformatics, with a particular focus on microbiome and microbiology research, alongside a broader enthusiasm for the life sciences. 
  Background in Medical Laboratory Science, including experience at the Provincial Laboratory of Public Health in Molecular Diagnostics and Acute Clinical Microbiology, as well as serving as lab manager for Dr. Ian Lewis' research group at the University of Calgary, which specializes in metabolomics and host-pathogen interactions in infectious disease.

